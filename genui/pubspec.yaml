publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  genui:
    git:
      url: https://github.com/flutter/genui.git
      ref: 3a9721bf57d5e45877ba2093379c92b522c77392
      path: packages/genui
  a2ui_core: 0.1.0
  json_schema_builder: 0.1.7
