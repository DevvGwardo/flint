[package]
name = "flint-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flint-platform.workspace = true
anyhow.workspace = true
async-channel.workspace = true
bytes = "1.12.1"
futures-util = "0.3.34"
libc = "0.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
shlex = "2.0.1"
similar = "3.2.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net", "fs"] }
tokio-util = "0.7.19"
uuid = { version = "=1.26.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
] }

[dev-dependencies]
pretty_assertions = "1.4.1"
