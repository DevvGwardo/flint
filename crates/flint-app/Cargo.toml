[package]
name = "flint-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "flint_app"
path = "src/lib.rs"

[[bin]]
name = "flint"
path = "src/main.rs"

[dependencies]
flint-agent.workspace = true
flint-acp.workspace = true
anyhow.workspace = true
async-channel.workspace = true
serde_json.workspace = true
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "tiff", "bmp"] }
tempfile = "3.27.0"
gpui-kit = "0.7.0"
ignore = "0.4.33"
toml = "1.1.6"
diffy = "0.5.2"
serde = { workspace = true, features = ["derive"] }
flint-term.workspace = true
unicode-width = "0.2.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "net"] }
tokio-util = "0.7.19"

[dev-dependencies]
pretty_assertions = "1"
gpui-kit = { version = "0.7.0", features = ["test-support"] }
