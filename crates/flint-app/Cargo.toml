[package]
name = "flint-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "flint_app"
path = "src/lib.rs"

[[bin]]
name = "flint"
path = "src/main.rs"

[dependencies]
flint-agent.workspace = true
flint-acp.workspace = true
anyhow.workspace = true
async-channel.workspace = true
serde_json.workspace = true
gpui-kit = "0.7.0"
ignore = "0.4.33"
toml = "1.1.6"
diffy = "0.5.2"
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1"
gpui-kit = { version = "0.7.0", features = ["test-support"] }
