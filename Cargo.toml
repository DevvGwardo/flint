[workspace]
resolver = "3"
members = ["crates/flint-agent", "crates/flint-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
flint-agent = { path = "crates/flint-agent" }
anyhow = "1"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
