[workspace]
resolver = "3"
members = ["crates/flint-agent", "crates/flint-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
flint-agent = { path = "crates/flint-agent" }
anyhow = "1"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# panic = "abort" is not set: the engine's tokio runtime and session threads
# rely on unwinding to contain a panicking task instead of killing the app.
